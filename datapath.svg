<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 770" width="1280" height="770" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="a-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <style>
      .box { fill:#f5f7fa; stroke:#333; stroke-width:1.5; }
      .ctl { fill:#fff7ed; stroke:#d97706; stroke-width:1.5; stroke-dasharray:5 3; }
      .preg { fill:#dbe4ee; stroke:#475569; stroke-width:1.5; }
      .mux { fill:#eef2f7; stroke:#333; stroke-width:1.5; }
      .t { font-size:13px; fill:#111; text-anchor:middle; }
      .ts { font-size:11px; fill:#444; text-anchor:middle; }
      .tl { font-size:11px; fill:#444; }
      .stage { font-size:16px; font-weight:bold; fill:#334155; text-anchor:middle; }
      .w { fill:none; stroke:#222; stroke-width:1.6; marker-end:url(#a-k); }
      .wn { fill:none; stroke:#222; stroke-width:1.6; }
      .wc { fill:none; stroke:#d97706; stroke-width:1.4; stroke-dasharray:5 3; marker-end:url(#a-o); }
      .wf { fill:none; stroke:#2563eb; stroke-width:1.8; marker-end:url(#a-b); }
      .wg { fill:none; stroke:#16a34a; stroke-width:1.8; marker-end:url(#a-g); }
      .wp { fill:none; stroke:#7c3aed; stroke-width:1.6; marker-end:url(#a-p); }
      .dot { fill:#222; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="770" fill="#ffffff"/>
  <text x="640" y="30" class="t" style="font-size:19px;font-weight:bold">LEGv8 5-Stage Pipelined Datapath</text>

  <!-- Stage labels -->
  <text x="115" y="50" class="stage">IF</text>
  <text x="410" y="50" class="stage">ID</text>
  <text x="735" y="50" class="stage">EX</text>
  <text x="975" y="50" class="stage">MEM</text>
  <text x="1165" y="50" class="stage">WB</text>

  <!-- Pipeline registers -->
  <rect x="220" y="80" width="22" height="520" class="preg"/>
  <rect x="580" y="80" width="22" height="520" class="preg"/>
  <rect x="870" y="80" width="22" height="520" class="preg"/>
  <rect x="1060" y="80" width="22" height="520" class="preg"/>
  <text x="231" y="632" class="ts">IF/ID</text>
  <text x="591" y="632" class="ts">ID/EX</text>
  <text x="881" y="632" class="ts">EX/MEM</text>
  <text x="1071" y="632" class="ts">MEM/WB</text>

  <!-- ===== IF ===== -->
  <polygon points="20,300 50,310 50,370 20,380" class="mux"/>
  <rect x="65" y="310" width="40" height="60" class="box"/>
  <text x="85" y="345" class="t">PC</text>
  <rect x="125" y="290" width="85" height="100" class="box"/>
  <text x="167" y="333" class="t">Instruction</text>
  <text x="167" y="350" class="t">Memory</text>
  <rect x="110" y="180" width="60" height="50" class="box"/>
  <text x="140" y="210" class="t">+4</text>

  <path d="M50,340 H65" class="w"/>
  <path d="M105,340 H125" class="w"/>
  <path d="M115,340 V250 H130 V230" class="w"/>
  <circle cx="115" cy="340" r="3" class="dot"/>
  <path d="M140,180 V150 H35 V303" class="w"/>
  <text x="80" y="144" class="tl">PC+4</text>
  <path d="M210,340 H220" class="w"/>
  <path d="M115,340 V490 H220" class="w"/>
  <text x="150" y="484" class="tl">PC</text>

  <!-- ===== ID ===== -->
  <rect x="270" y="90" width="110" height="55" class="ctl"/>
  <text x="325" y="122" class="t">Control</text>
  <rect x="410" y="90" width="140" height="55" class="ctl"/>
  <text x="480" y="114" class="t">Hazard</text>
  <text x="480" y="131" class="t">Detection</text>
  <rect x="490" y="158" width="70" height="38" class="ctl"/>
  <text x="525" y="181" class="ts">bubble</text>

  <rect x="290" y="230" width="110" height="130" class="box"/>
  <text x="345" y="285" class="t">Register</text>
  <text x="345" y="302" class="t">File</text>
  <text x="345" y="322" class="ts">(write-through</text>
  <text x="345" y="336" class="ts">bypass)</text>
  <rect x="290" y="380" width="110" height="42" class="box"/>
  <text x="345" y="406" class="t">Sign Extend</text>

  <rect x="300" y="450" width="260" height="120" class="box"/>
  <text x="430" y="472" class="t" style="font-weight:bold">Branch Unit</text>
  <text x="430" y="494" class="ts">forward Rn from EX / MEM / WB</text>
  <text x="430" y="512" class="ts">CBZ: Rn == 0   •   B.LT: N ≠ V (live flags)</text>
  <text x="430" y="530" class="ts">target = PC + imm   •   BR: PC = Rn</text>
  <text x="430" y="552" class="ts">→ next-PC select</text>

  <!-- IF/ID outputs -->
  <path d="M242,117 H270" class="w"/>
  <text x="246" y="110" class="tl" style="font-size:10px">opcode</text>
  <path d="M242,295 H290" class="w"/>
  <path d="M242,400 H290" class="w"/>
  <path d="M242,490 H300" class="w"/>
  <text x="250" y="484" class="tl" style="font-size:10px">PC_D</text>

  <!-- control → bubble → ID/EX -->
  <path d="M325,145 V177 H490" class="wc"/>
  <path d="M520,145 V158" class="wc"/>
  <path d="M560,177 H580" class="wc"/>
  <!-- stall -->
  <path d="M440,90 V72 H85 V310" class="wc"/>
  <path d="M231,72 V80" class="wc"/>
  <text x="300" y="67" class="tl" style="fill:#d97706">stall: hold PC and IF/ID</text>

  <!-- regfile & sign ext → ID/EX -->
  <path d="M400,270 H580" class="w"/>
  <text x="470" y="264" class="tl">ReadData1</text>
  <path d="M400,320 H580" class="w"/>
  <text x="470" y="314" class="tl">ReadData2</text>
  <path d="M400,400 H580" class="w"/>
  <text x="490" y="394" class="tl">imm</text>
  <path d="M420,270 V450" class="w"/>
  <circle cx="420" cy="270" r="3" class="dot"/>
  <path d="M450,400 V450" class="w"/>
  <circle cx="450" cy="400" r="3" class="dot"/>

  <!-- next PC from branch unit -->
  <path d="M430,570 V650 H35 V377" class="wg"/>
  <text x="180" y="665" class="tl" style="fill:#16a34a">branch / BR target → next PC</text>

  <!-- ===== EX ===== -->
  <polygon points="630,240 658,250 658,290 630,300" class="mux"/>
  <polygon points="630,305 658,315 658,355 630,365" class="mux"/>
  <polygon points="690,330 718,340 718,380 690,390" class="mux"/>
  <polygon points="750,230 810,270 810,360 750,400 750,330 765,315 750,300" class="box"/>
  <text x="788" y="320" class="t">ALU</text>
  <rect x="750" y="150" width="60" height="40" class="box"/>
  <text x="780" y="175" class="t">Flags</text>
  <rect x="640" y="470" width="150" height="55" class="ctl"/>
  <text x="715" y="494" class="t">Forwarding</text>
  <text x="715" y="511" class="t">Unit</text>

  <path d="M602,270 H630" class="w"/>
  <path d="M602,320 H630" class="w"/>
  <path d="M602,400 H675 V375 H690" class="w"/>
  <path d="M658,270 H750" class="w"/>
  <path d="M658,335 H672 V345 H690" class="w"/>
  <path d="M718,360 H750" class="w"/>
  <path d="M810,315 H870" class="w"/>
  <path d="M780,230 V190" class="w"/>
  <text x="790" y="215" class="tl" style="font-size:10px">NZVC</text>
  <!-- store data -->
  <path d="M672,345 V430 H870" class="w"/>
  <circle cx="672" cy="345" r="3" class="dot"/>
  <text x="760" y="424" class="tl">store data</text>
  <!-- forwarding select -->
  <path d="M650,470 V368" class="wc"/>
  <text x="656" y="458" class="tl" style="fill:#d97706;font-size:10px">fwd sel</text>

  <!-- EX → branch unit (live result + flags) -->
  <path d="M835,315 V540 H560" class="wg"/>
  <circle cx="835" cy="315" r="3" class="dot"/>
  <path d="M810,170 H850 V545" class="wn" style="stroke:#16a34a;stroke-dasharray:4 3"/>
  <text x="640" y="556" class="tl" style="fill:#16a34a;font-size:10px">EX result + live N/V → branch</text>

  <!-- ===== MEM ===== -->
  <rect x="915" y="260" width="110" height="130" class="box"/>
  <text x="970" y="320" class="t">Data</text>
  <text x="970" y="337" class="t">Memory</text>
  <path d="M892,315 H915" class="w"/>
  <text x="922" y="278" class="tl" style="font-size:10px">addr</text><text x="922" y="384" class="tl" style="font-size:10px">wr data</text>
  <path d="M892,430 H945 V390" class="w"/>
  <path d="M1025,315 H1060" class="w"/>
  <path d="M905,315 V460 H1060" class="w"/>
  <circle cx="905" cy="315" r="3" class="dot"/>
  <text x="975" y="454" class="tl">ALU result</text>

  <!-- PC+4 for BL down the pipe -->
  <path d="M602,585 H870" class="wp"/>
  <path d="M892,585 H1060" class="wp"/>
  <path d="M1082,585 H1130" class="wp"/>
  <text x="940" y="579" class="tl" style="fill:#7c3aed">PC+4 (BL link → X30)</text>

  <!-- ===== WB ===== -->
  <polygon points="1130,290 1160,300 1160,590 1130,600" class="mux"/>
  <path d="M1082,315 H1130" class="w"/>
  <text x="1090" y="309" class="tl" style="font-size:10px">mem</text>
  <path d="M1082,460 H1130" class="w"/>
  <text x="1090" y="454" class="tl" style="font-size:10px">ALU</text>

  <!-- writeback to register file -->
  <path d="M1160,445 H1200 V690 H270 V345 H290" class="w"/>
  <text x="700" y="684" class="tl">WriteData → register file (and write-through bypass)</text>

  <!-- MEM-stage forwarding (EX/MEM → EX) -->
  <path d="M898,315 V604 H618 V355 H630" class="wf"/>
  <path d="M618,290 H630" class="wf"/>
  <circle cx="898" cy="315" r="3" class="dot"/>
  <!-- WB-stage forwarding (MEM/WB → EX) -->
  <path d="M1200,611 H612 V345 H630" class="wf"/>
  <path d="M612,280 H630" class="wf"/>
  <circle cx="1200" cy="611" r="3" class="dot"/>
  <text x="900" y="652" class="tl" style="fill:#2563eb">forwarding: EX/MEM and MEM/WB → ALU inputs</text>

  <!-- Legend -->
  <g transform="translate(250,725)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#222" stroke-width="1.6"/><text x="42" y="4" class="tl">datapath</text>
    <line x1="130" y1="0" x2="164" y2="0" stroke="#2563eb" stroke-width="1.8"/><text x="172" y="4" class="tl">forwarding to EX</text>
    <line x1="300" y1="0" x2="334" y2="0" stroke="#16a34a" stroke-width="1.8"/><text x="342" y="4" class="tl">branch resolution (ID)</text>
    <line x1="490" y1="0" x2="524" y2="0" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 3"/><text x="532" y="4" class="tl">control / hazard</text>
    <line x1="650" y1="0" x2="684" y2="0" stroke="#7c3aed" stroke-width="1.6"/><text x="692" y="4" class="tl">BL link value</text>
  </g>
</svg>
